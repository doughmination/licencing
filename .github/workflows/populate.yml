name: Sync licence

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity + gh auth
        env:
          GH_TOKEN: ${{ secrets.LICENCE_SYNC_TOKEN }}
        run: |
          git config --global user.name  "licence-bot"
          git config --global user.email "324896816+licence-bot@users.noreply.github.com"
          gh auth setup-git
          
      - name: Run sync
        working-directory: script
        env:
          GH_TOKEN: ${{ secrets.LICENCE_SYNC_TOKEN }}
        run: |
          chmod +x ./sync-licence.sh
          ./sync-licence.sh
